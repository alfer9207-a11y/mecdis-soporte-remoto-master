name: Windows Build (Artifact)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      VCPKG_TRIPLET: x64-windows-static

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install NASM (needed for some codec deps on Windows)
        shell: pwsh
        run: |
          choco install nasm -y

      - name: Setup vcpkg (manifest mode, static triplet)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (!(Test-Path "vcpkg.json")) {
            Write-Error "vcpkg.json no encontrado en la raiz del repo"
            exit 1
          }

          $vcpkg = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          if (!(Test-Path $vcpkg)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkg
          }
          & "$vcpkg\bootstrap-vcpkg.bat"

          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Append

          Push-Location $env:GITHUB_WORKSPACE
          # Manifest install for the SAME triplet that Rust build expects (x64-windows-static)
          & "$vcpkg\vcpkg.exe" install --triplet $env:VCPKG_TRIPLET
          Pop-Location

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build backend (Rust) -> portable\backend\mecdis-backend.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Ensure cargo sees the same vcpkg triplet
          $env:VCPKG_DEFAULT_TRIPLET = $env:VCPKG_TRIPLET
          $env:VCPKG_TARGET_TRIPLET  = $env:VCPKG_TRIPLET

          cargo build --release --features flutter

          $src = Join-Path $env:GITHUB_WORKSPACE "target\release\rustdesk.exe"
          if (!(Test-Path $src)) {
            $candidates = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "target\release") -Filter "*.exe" -ErrorAction SilentlyContinue
            if ($candidates.Count -eq 0) { throw "No EXE produced in target\release" }
            $src = $candidates[0].FullName
          }

          New-Item -Force -ItemType Directory (Join-Path $env:GITHUB_WORKSPACE "portable\backend") | Out-Null
          New-Item -Force -ItemType Directory (Join-Path $env:GITHUB_WORKSPACE "appimage\portable\backend") | Out-Null

          Copy-Item -Force $src (Join-Path $env:GITHUB_WORKSPACE "portable\backend\mecdis-backend.exe")
          Copy-Item -Force $src (Join-Path $env:GITHUB_WORKSPACE "appimage\portable\backend\mecdis-backend.exe")

          $len = (Get-Item (Join-Path $env:GITHUB_WORKSPACE "portable\backend\mecdis-backend.exe")).Length
          if ($len -lt 1000000) { throw "Backend demasiado chico ($len bytes). Sigue siendo placeholder." }
          Write-Host "Backend OK, size: $len bytes"

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: false

      - name: Verify Flutter/Dart + enable windows
        shell: pwsh
        run: |
          flutter --version
          dart --version
          flutter config --enable-windows-desktop

      - name: Pub get
        working-directory: flutter
        shell: pwsh
        run: |
          flutter pub get

      - name: Build Windows UI (Release)
        working-directory: flutter
        shell: pwsh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          flutter build windows --release -v

      - name: Prepare dist (UI + portable backend)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item -Recurse -Force "flutter\build\windows\x64\runner\Release\*" "dist\"

          if (Test-Path "portable") {
            Copy-Item -Recurse -Force "portable" "dist\portable"
          } else {
            throw "Carpeta 'portable' no existe en la raiz"
          }

          if (!(Test-Path "dist\portable\backend\mecdis-backend.exe")) {
            throw "No se empaquetó el backend en dist\portable\backend\mecdis-backend.exe"
          }

      - name: Create final ZIP
        shell: pwsh
        run: |
          $run = "${{ github.run_number }}"
          $zip = "Mec-Dis-Soporte-Remoto-main-$run.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\*" -DestinationPath $zip -Force
          Write-Host "ZIP listo: $zip"

      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Mec-Dis-Soporte-Remoto-main-${{ github.run_number }}
          path: Mec-Dis-Soporte-Remoto-main-${{ github.run_number }}.zip

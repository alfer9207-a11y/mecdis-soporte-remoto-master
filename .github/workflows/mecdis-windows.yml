name: Windows Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  VCPKG_FEATURE_FLAGS: manifests

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg (manifest mode)
        shell: powershell
        run: |
          if (!(Test-Path "vcpkg.json")) {
              Write-Error "vcpkg.json no encontrado"
              exit 1
          }
          vcpkg install

      # (resto del workflow queda igual)

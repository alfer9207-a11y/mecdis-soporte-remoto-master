name: Windows Build (Artifact)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      VCPKG_TRIPLET: x64-windows-static
      OPUS_VER: "v1.5.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install NASM (needed for codec deps on Windows)
        shell: pwsh
        run: choco install nasm -y

      - name: Setup vcpkg (manifest mode, static triplet)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (!(Test-Path "vcpkg.json")) {
            throw "vcpkg.json no encontrado en la raiz del repo"
          }

          $vcpkg = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          if (!(Test-Path $vcpkg)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkg
          }
          & "$vcpkg\bootstrap-vcpkg.bat"

          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Append

          Push-Location $env:GITHUB_WORKSPACE
          & "$vcpkg\vcpkg.exe" install --triplet $env:VCPKG_TRIPLET
          Pop-Location

      - name: BLINDAJE Opus headers (si falta opus_multistream.h)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          $inc = Join-Path $vcpkg "installed\$env:VCPKG_TRIPLET\include\opus"
          $need = Join-Path $inc "opus_multistream.h"

          if (!(Test-Path $need)) {
            Write-Host "opus_multistream.h NO existe en vcpkg include. Aplicando blindaje (descarga headers de Opus $env:OPUS_VER)..."
            New-Item -Force -ItemType Directory $inc | Out-Null

            $base = "https://raw.githubusercontent.com/xiph/opus/$env:OPUS_VER/include"
            $files = @(
              "opus.h",
              "opus_defines.h",
              "opus_multistream.h",
              "opus_types.h",
              "opus_custom.h",
              "opus_projection.h",
              "opus_multistream_surround.h"
            )

            foreach ($f in $files) {
              $url = "$base/$f"
              $dst = Join-Path $inc $f
              try {
                Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
                Write-Host "OK: $f"
              } catch {
                Write-Host "WARN: no se pudo bajar $f ($url). Continuando..."
              }
            }

            if (!(Test-Path $need)) {
              throw "Blindaje falló: sigue faltando $need"
            }
          } else {
            Write-Host "OK: opus_multistream.h ya existe."
          }

      - name: BLINDAJE libvpx headers (si faltan headers vpx/*.h)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vpxInclude = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows-static\include\vpx"
          New-Item -ItemType Directory -Force -Path $vpxInclude | Out-Null

          $need = @("vp8.h","vpx_encoder.h","vpx_ext_ratectrl.h","vpx_codec.h")
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $vpxInclude $_)) }

          if ($missing.Count -gt 0) {
            Write-Host "Missing libvpx headers: $($missing -join ', ')"
            $tmp = "$env:RUNNER_TEMP\libvpx"
            Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $tmp | Out-Null

            $zip = "$tmp\libvpx.zip"
            Invoke-WebRequest -Uri "https://github.com/webmproject/libvpx/archive/refs/tags/v1.13.1.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $tmp -Force

            $srcDir = Get-ChildItem $tmp -Directory | Where-Object { $_.Name -like "libvpx-*" } | Select-Object -First 1
            if (-not $srcDir) { throw "libvpx source folder not found after unzip" }

            Copy-Item "$($srcDir.FullName)\vpx\*.h" $vpxInclude -Force
            Write-Host "Patched libvpx headers into: $vpxInclude"
          } else {
            Write-Host "libvpx headers OK"
          }

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate/patch aom headers (FULL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $aomInclude = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows-static\include\aom"
          New-Item -ItemType Directory -Force -Path $aomInclude | Out-Null

          if (-not (Test-Path (Join-Path $aomInclude "aom.h"))) {
            Write-Host "Missing aom headers; downloading upstream headers..."
            $tmp = "$env:RUNNER_TEMP\aom"
            Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $tmp | Out-Null

            $zip = "$tmp\aom.zip"
            Invoke-WebRequest -Uri "https://github.com/AOMediaCodec/aom/archive/refs/heads/main.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $tmp -Force

            $srcDir = Get-ChildItem $tmp -Directory | Where-Object { $_.Name -like "aom-*" } | Select-Object -First 1
            if (-not $srcDir) { throw "aom source folder not found after unzip" }

            Copy-Item "$($srcDir.FullName)\aom\*.h" $aomInclude -Force
            Write-Host "Patched aom headers into: $aomInclude"
          } else {
            Write-Host "aom headers OK"
          }

      - name: Build backend (Rust) -> portable\backend\mecdis-backend.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VCPKG_DEFAULT_TRIPLET = $env:VCPKG_TRIPLET
          $env:VCPKG_TARGET_TRIPLET  = $env:VCPKG_TRIPLET

          cargo build --release --features flutter

          $src = Join-Path $env:GITHUB_WORKSPACE "target\release\rustdesk.exe"
          if (!(Test-Path $src)) {
            $candidates = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "target\release") -Filter "*.exe" -ErrorAction SilentlyContinue
            if ($candidates.Count -eq 0) { throw "No EXE produced in target\release" }
            $src = $candidates[0].FullName
          }

          New-Item -Force -ItemType Directory (Join-Path $env:GITHUB_WORKSPACE "portable\backend") | Out-Null
          New-Item -Force -ItemType Directory (Join-Path $env:GITHUB_WORKSPACE "appimage\portable\backend") | Out-Null

          Copy-Item -Force $src (Join-Path $env:GITHUB_WORKSPACE "portable\backend\mecdis-backend.exe")
          Copy-Item -Force $src (Join-Path $env:GITHUB_WORKSPACE "appimage\portable\backend\mecdis-backend.exe")

          $len = (Get-Item (Join-Path $env:GITHUB_WORKSPACE "portable\backend\mecdis-backend.exe")).Length
          if ($len -lt 1000000) { throw "Backend demasiado chico ($len bytes). Sigue siendo placeholder." }
          Write-Host "Backend OK, size: $len bytes"

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: false

      - name: Build Windows UI (Release)
        working-directory: flutter
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release -v

      - name: Prepare dist (UI + portable backend)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item -Recurse -Force "flutter\build\windows\x64\runner\Release\*" "dist\"
          Copy-Item -Recurse -Force "portable" "dist\portable"

          if (!(Test-Path "dist\portable\backend\mecdis-backend.exe")) {
            throw "No se empaquetó el backend en dist\portable\backend\mecdis-backend.exe"
          }

      - name: Create final ZIP
        shell: pwsh
        run: |
          $run = "${{ github.run_number }}"
          $zip = "Mec-Dis-Soporte-Remoto-main-$run.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\*" -DestinationPath $zip -Force
          Write-Host "ZIP listo: $zip"

      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Mec-Dis-Soporte-Remoto-main-${{ github.run_number }}
          path: Mec-Dis-Soporte-Remoto-main-${{ github.run_number }}.zip

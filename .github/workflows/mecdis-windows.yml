name: Windows Build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup vcpkg (manifest mode)
        shell: powershell
        run: |
          if (!(Test-Path "vcpkg.json")) {
            Write-Error "vcpkg.json no encontrado"
            exit 1
          }
          vcpkg install

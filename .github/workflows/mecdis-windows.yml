name: build-windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      RUST_BACKTRACE: "1"
      VCPKG_DISABLE_METRICS: "1"

    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install Flutter (with cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter sanity (doctor + precache + pub get)
        shell: pwsh
        run: |
          flutter --version
          flutter config --no-analytics --no-cli-animations
          for ($i=1; $i -le 3; $i++) {
            flutter precache --windows
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          flutter doctor -v
          Push-Location flutter
          flutter pub get
          Pop-Location

      - name: MSVC dev cmd (needed for vcpkg + native deps)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Force VCPKG_ROOT (avoid VS integrated vcpkg)
        shell: pwsh
        run: |
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DISABLE_METRICS=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Forced VCPKG_ROOT=C:\vcpkg"

      - name: Cache vcpkg (installed + downloads)
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-opus-v1

      - name: Bootstrap vcpkg (if missing)
        shell: pwsh
        run: |
          $root = "C:\vcpkg"
          if (-not (Test-Path "$root\vcpkg.exe")) {
            Write-Host "Cloning vcpkg into $root ..."
            git clone --depth 1 https://github.com/microsoft/vcpkg "$root"
          }
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          & "$root\vcpkg.exe" version

      # Ensures opus headers exist for magnum-opus. exist for magnum-opus.
      - name: Ensure Opus via vcpkg (needed by magnum-opus)
        shell: pwsh
        run: |
          $root = "C:\vcpkg"
          $trip = "x64-windows"
          $hdr = "$root\installed\$trip\include\opus\opus.h"
          if (Test-Path $hdr) {
            Write-Host "OK: Found $hdr"
            & "$root\vcpkg.exe" version
          } else {
            Write-Host "Missing $hdr -> installing opus ($trip) via vcpkg"
            $log = Join-Path $env:RUNNER_TEMP "vcpkg-opus.log"
            for ($i=1; $i -le 3; $i++) {
              Write-Host "vcpkg install attempt $i/3 ..."
              & "$root\vcpkg.exe" install "opus" "--triplet=$trip" --recurse --x-wait-for-lock 2>&1 | Tee-Object -FilePath $log
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 10
            }
            if ($LASTEXITCODE -ne 0) {
              Write-Host "---- vcpkg-opus.log (tail) ----"
              Get-Content $log -Tail 200
              throw "vcpkg opus install failed"
            }
            if (-not (Test-Path $hdr)) { throw "Opus headers still missing after vcpkg install" }
          }

      - name: Print key env (debug) (debug)
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET"
          rustc -V
          cargo -V

      - name: Build Windows (standard, no hwcodec, no vram)
        shell: pwsh
        run: |
          python .\build.py --flutter --skip-portable

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            **\*.msi
            **\*.exe
            **\dist\**
            **\build\**
          if-no-files-found: warn

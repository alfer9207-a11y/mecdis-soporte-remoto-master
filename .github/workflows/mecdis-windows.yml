# Patch: hwcodec build fix (set VCPKG_ROOT + backtrace)
# Drop-in replacement for .github/workflows/mecdis-windows.yml sections:
# - Add env: VCPKG_ROOT, RUST_BACKTRACE
# - Ensure vcpkg is at C:\vcpkg (matches existing steps)
# - Build step unchanged, but now hwcodec build.rs can find VCPKG_ROOT

name: build-windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
      VCPKG_ROOT: C:\vcpkg
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install Flutter (with cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter sanity (doctor + precache + pub get)
        shell: pwsh
        run: |
          flutter --version
          flutter config --no-analytics --no-cli-animations

          for ($i=1; $i -le 3; $i++) {
            Write-Host "flutter precache attempt $i/3"
            flutter precache --windows
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          if ($LASTEXITCODE -ne 0) { throw "flutter precache failed" }

          flutter doctor -v

          Push-Location flutter
          flutter pub get
          Pop-Location

      # Keep your existing vcpkg install step(s) here (do not change paths).
      # IMPORTANT: vcpkg must live at C:\vcpkg to match VCPKG_ROOT above.

      - name: Print key env (debug)
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "PUB_CACHE=$env:PUB_CACHE"
          rustc -V
          cargo -V

      - name: Build Windows (Flutter + packaged EXE)
        shell: pwsh
        run: |
          python .\build.py --hwcodec --flutter --vram --skip-portable

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            **\*.msi
            **\*.exe
            **\dist\**
            **\build\**
          if-no-files-found: warn

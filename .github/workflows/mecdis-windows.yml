name: Mec-Dis Windows Build (Installer + Portable)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      PUB_CACHE: ${{ github.workspace }}\.pub-cache

      # vcpkg: always use our own copy
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

      RUST_BACKTRACE: "1"
      CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG: "true"

    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      # FIX: extended_text 14.x requires Dart SDK >= 3.5.0
      # Dart 3.5.x ships with Flutter 3.24.x (stable)
      - name: Install Flutter 3.24.5 (stable) + cache
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter sanity (analytics off + precache + pub get)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Keep it compatible across Flutter versions:
          # - do NOT use "flutter --disable-telemetry" (not available in some versions)
          # - do NOT use "--no-cli-animations" (breaks older tools)
          flutter config --no-analytics

          for ($i=1; $i -le 3; $i++) {
            flutter precache --windows
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }

          Push-Location flutter
          flutter pub get
          Pop-Location

      - name: MSVC dev cmd (needed for vcpkg + native deps)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Force vcpkg env (override VS integrated vcpkg) [HARD]
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          $env:VCPKG_TARGET_TRIPLET = "x64-windows-static"

          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_TARGET_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap vcpkg (if missing) [C:\vcpkg only]
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkg = "C:\vcpkg"
          if (-not (Test-Path "$vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg $vcpkg
            & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$vcpkg\vcpkg.exe" version

      - name: Ensure native deps via vcpkg (classic mode ONLY) [STATIC]
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trip = "x64-windows-static"

          function Ensure-Port($port, $headerPath) {
            $hdr = "C:\vcpkg\installed\$trip\include\$headerPath"
            if (Test-Path $hdr) { Write-Host "OK: $port header exists: $hdr"; return }

            $log = Join-Path $env:RUNNER_TEMP "vcpkg-$port.log"
            Write-Host "Installing $port via vcpkg classic mode -> triplet=$trip"
            & "C:\vcpkg\vcpkg.exe" install $port `
              "--classic" `
              "--x-install-root=C:\vcpkg\installed" `
              "--triplet" $trip `
              "--clean-after-build" 2>&1 | Tee-Object -FilePath $log

            if ($LASTEXITCODE -ne 0) {
              Write-Host "==== vcpkg-$port.log (tail) ===="
              Get-Content $log -Tail 250
              throw "vcpkg install failed: $port"
            }
            if (-not (Test-Path $hdr)) {
              Write-Host "==== vcpkg-$port.log (tail) ===="
              Get-Content $log -Tail 250
              throw "Header still missing after install: $hdr"
            }
          }

          Ensure-Port "opus" "opus\opus_multistream.h"
          Ensure-Port "libvpx" "vpx\vp8.h"
          Ensure-Port "aom" "aom\aom.h"
          Ensure-Port "libyuv" "libyuv\convert.h"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (Rust)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache vcpkg (Windows native deps)
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
            C:\vcpkg\packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', '**/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Prepare portable packer required assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "libs\portable\res" | Out-Null
          New-Item -ItemType Directory -Force -Path "libs\portable\src\res" | Out-Null
          $dataBin = "libs\portable\data.bin"
          if (-not (Test-Path $dataBin)) { [System.IO.File]::WriteAllBytes($dataBin, @()) }
          $bytes = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMB/6X2Z0sAAAAASUVORK5CYII=")
          $label1 = "libs\portable\res\label.png"
          if (-not (Test-Path $label1)) { [System.IO.File]::WriteAllBytes($label1, $bytes) }
          $label2 = "libs\portable\src\res\label.png"
          if (-not (Test-Path $label2)) { [System.IO.File]::WriteAllBytes($label2, $bytes) }
          $metaToml = "libs\portable\app_metadata.toml"
          if (-not (Test-Path $metaToml)) {
            @(
              'name = "Mec-Dis Soporte Remoto"',
              'publisher = "Mec-Dis Computadoras"',
              'homepage = "https://mec-dis.com"'
            ) | Set-Content -Path $metaToml -Encoding UTF8
          }

      - name: Build portable packer (needed for installer exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -p rustdesk-portable-packer --release

      - name: Build Mec-Dis (Flutter) + create Installer EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python build.py --flutter --portable

      - name: Prepare Mec-Dis artifacts (Setup EXE + Portable Folder)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          # (Optional) Setup EXE from libs/portable (if present)
          $installer = Get-ChildItem -Path "libs/portable" -Filter "rustdesk-*-install.exe" -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -ne $installer) {
            Copy-Item $installer.FullName (Join-Path "dist" "Mec-Dis-Soporte-Remoto-Setup.exe") -Force
          }

          # Portable folder = Flutter Windows Release output (must include ALL *.dll + data/)
          $releaseDir = "flutter\build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) { throw "Flutter Release output missing: $releaseDir" }

          $portableDir = Join-Path "dist" "Mec-Dis-Soporte-Remoto-Portable"
          if (Test-Path $portableDir) { Remove-Item $portableDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -Path (Join-Path $releaseDir "*") -Destination $portableDir -Recurse -Force

          # Quick instructions to avoid "missing *.dll" errors
          @(
            "Mec-Dis Soporte Remoto (PORTABLE)",
            "",
            "✅ IMPORTANTE:",
            "1) NO ejecutes el .exe suelto fuera de esta carpeta.",
            "2) Ejecuta: .\Mec-Dis-Soporte-Remoto-Portable\Mec-Dis-Soporte-Remoto.exe",
            "3) Mantén juntos: data\ + *.dll + flutter_windows.dll",
            "",
            "Si ves errores tipo: 'no se encontró desktop_*.dll', es porque moviste solo el EXE.",
            ""
          ) | Set-Content -Encoding UTF8 (Join-Path "dist" "README_PORTABLE.txt")

      - name: Upload Mec-Dis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mec-Dis-Windows
          path: dist/*

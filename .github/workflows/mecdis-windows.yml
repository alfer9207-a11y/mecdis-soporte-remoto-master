name: Mec-Dis Windows Build FINAL

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      # IMPORTANT: RustDesk depends on the hbb_common git submodule.
      # If submodules are not fetched, the Rust build fails with:
      #   "The system cannot find the file specified (os error 2)" for libs\\hbb_common\\Cargo.toml
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure submodules are initialized
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # Build the Rust core (backend) and ship it as portable\backend\mecdis-backend.exe.
      # Without this, the downloaded artifact will contain only a placeholder file (few bytes)
      # and nothing will listen on the expected local port.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build backend (RustDesk core)
        shell: pwsh
        run: |
          # Build the main Rust binary. Some forks use the "flutter" feature; if your fork does not,
          # remove the --features flag.
          cargo build --release --features flutter

          $exe = "${{ github.workspace }}\\target\\release\\rustdesk.exe"
          if (!(Test-Path $exe)) { throw "Backend build did not produce rustdesk.exe at: $exe" }

          # Copy/rename to the expected locations
          New-Item -Force -ItemType Directory "portable\\backend" | Out-Null
          New-Item -Force -ItemType Directory "appimage\\portable\\backend" | Out-Null
          Copy-Item -Force $exe "portable\\backend\\mecdis-backend.exe"
          Copy-Item -Force $exe "appimage\\portable\\backend\\mecdis-backend.exe"

          # Safety check: ensure it is a real executable (not a tiny placeholder)
          $len = (Get-Item "portable\\backend\\mecdis-backend.exe").Length
          if ($len -lt 1000000) { throw "mecdis-backend.exe too small ($len bytes). Backend packaging is broken." }

      - name: Install Flutter (Dart >= 3.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: false

      - name: Verify Flutter/Dart versions
        shell: pwsh
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build Windows EXE (Release, verbose)
        working-directory: flutter
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: flutter build windows --release -v

      - name: Prepare portable
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force flutter\build\windows\x64\runner\Release\* dist\
          Copy-Item -Recurse -Force portable dist\portable

      - name: Zip portable
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath Mec-Dis-Soporte-Remoto.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mec-Dis-Soporte-Remoto
          path: Mec-Dis-Soporte-Remoto.zip

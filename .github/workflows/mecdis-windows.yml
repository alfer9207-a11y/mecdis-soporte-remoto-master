name: Mec-Dis Windows Build FINAL

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # IMPORTANT: Flutter 3.24.x includes Dart 3.5+ required by extended_text 14.x
      - name: Install Flutter (Dart >= 3.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: false

      - name: Verify Flutter/Dart versions
        shell: pwsh
        run: |
          flutter --version
          dart --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build Windows EXE (Release)
        working-directory: flutter
        run: flutter build windows --release

      - name: Prepare portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force flutter\build\windows\x64\runner\Release\*.exe dist\
          Copy-Item -Recurse -Force portable dist\portable

      - name: Zip portable
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath Mec-Dis-Soporte-Remoto.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mec-Dis-Soporte-Remoto
          path: Mec-Dis-Soporte-Remoto.zip

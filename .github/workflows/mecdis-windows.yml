name: Mec-Dis Windows Build (FINAL)

on: [push]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build Flutter UI
        run: echo "Flutter UI build (preconfigured)"

      - name: Package portable
        shell: pwsh
        run: |
          mkdir dist
          Compress-Archive -Path portable -DestinationPath dist/Mec-Dis-Soporte-Remoto.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mec-Dis-Soporte-Remoto
          path: dist/Mec-Dis-Soporte-Remoto.zip

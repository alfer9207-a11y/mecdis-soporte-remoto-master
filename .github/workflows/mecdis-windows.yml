name: Mec-Dis Windows Build (Installer + Portable)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      PUB_CACHE: ${{ github.workspace }}\.pub-cache

      # Force OUR vcpkg, not Visual Studio's integrated vcpkg
      VCPKG_ROOT: C:\vcpkg

      # magnum-opus is building against x64-windows-static, so match it
      VCPKG_DEFAULT_TRIPLET: x64-windows-static

      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install Flutter (with cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter sanity (precache + pub get)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter config --no-analytics --no-cli-animations
          for ($i=1; $i -le 3; $i++) {
            flutter precache --windows
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          Push-Location flutter
          flutter pub get
          Pop-Location

      - name: MSVC dev cmd (needed for vcpkg + native deps)
        uses: ilammy/msvc-dev-cmd@v1

      # msvc-dev-cmd can inject Visual Studio's vcpkg env.
      # Re-force the correct values for subsequent steps via GITHUB_ENV.
      - name: Force vcpkg env (override VS integrated vcpkg)
        shell: pwsh
        run: |
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_TARGET_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Forced VCPKG_ROOT and triplet to x64-windows-static"

      - name: Bootstrap vcpkg (if missing)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat
          }
          & C:\vcpkg\vcpkg.exe version
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET"

      - name: Ensure Opus via vcpkg (classic mode ONLY) [STATIC]
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trip = $env:VCPKG_DEFAULT_TRIPLET
          if ([string]::IsNullOrWhiteSpace($trip)) { $trip = "x64-windows-static" }

          $hdr = "C:\vcpkg\installed\$trip\include\opus\opus_multistream.h"
          if (Test-Path $hdr) {
            Write-Host "OK: Found $hdr"
            exit 0
          }

          $log = Join-Path $env:RUNNER_TEMP "vcpkg-opus-classic.log"
          Write-Host "Installing ONLY opus via vcpkg classic mode -> triplet=$trip"
          & "C:\vcpkg\vcpkg.exe" install opus `
            "--classic" `
            "--x-install-root=C:\vcpkg\installed" `
            "--triplet" $trip `
            "--clean-after-build" 2>&1 | Tee-Object -FilePath $log

          if ($LASTEXITCODE -ne 0) {
            Write-Host "==== vcpkg-opus-classic.log (tail) ===="
            Get-Content $log -Tail 250
            throw "vcpkg opus (classic) install failed"
          }

          if (-not (Test-Path $hdr)) {
            Write-Host "==== vcpkg-opus-classic.log (tail) ===="
            Get-Content $log -Tail 250
            throw "Opus headers still missing after classic install"
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build portable packer (needed for installer exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -p rustdesk-portable-packer --release

      - name: Build Mec-Dis (Flutter) + create Installer EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python build.py --flutter --portable

      - name: Upload artifacts (grab everything built)
        uses: actions/upload-artifact@v4
        with:
          name: Mec-Dis-Windows
          path: |
            **/dist/*
            **/libs/portable/*.exe
            **/flutter/build/windows/**/Release/**

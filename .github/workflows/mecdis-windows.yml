name: Mec-Dis Windows Build (Repaired vcpkg)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure vcpkg bootstrap
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat
          }

      - name: Ensure Opus via vcpkg (manifest mode) [FIX]
        shell: pwsh
        run: |
          $trip = $env:VCPKG_DEFAULT_TRIPLET
          if ([string]::IsNullOrWhiteSpace($trip)) { $trip = "x64-windows" }

          $hdr = "C:\vcpkg\installed\$trip\include\opus\opus.h"
          if (Test-Path $hdr) {
            Write-Host "OK: Found $hdr"
            exit 0
          }

          Write-Host "Installing vcpkg manifest deps (includes opus) -> triplet=$trip"
          $log = Join-Path $env:RUNNER_TEMP "vcpkg-manifest.log"

          Push-Location $env:GITHUB_WORKSPACE

          & "C:\vcpkg\vcpkg.exe" install `
            "--x-manifest-root=." `
            "--x-install-root=C:\vcpkg\installed" `
            "--triplet" $trip `
            "--clean-after-build" 2>&1 | Tee-Object -FilePath $log

          $code = $LASTEXITCODE
          Pop-Location

          if ($code -ne 0) {
            Write-Host "==== vcpkg-manifest.log (tail) ===="
            Get-Content $log -Tail 200
            throw "vcpkg manifest install failed"
          }

          if (-not (Test-Path $hdr)) {
            Write-Host "==== vcpkg-manifest.log (tail) ===="
            Get-Content $log -Tail 200
            throw "Opus headers still missing after vcpkg manifest install"
          }

      # Resto de tu pipeline (Flutter, Rust, packer, etc.) aquí
name: Windows Build (Artifact)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # SIN SCRAP (sin compilar RustDesk en CI):
      # Descargamos un backend precompilado oficial de RustDesk y lo renombramos a mecdis-backend.exe
      - name: Download backend (prebuilt) -> portable\backend\mecdis-backend.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ver = "1.4.5"
          $url = "https://github.com/rustdesk/rustdesk/releases/download/$ver/rustdesk-$ver-x86_64.exe"
          $dst = Join-Path $env:GITHUB_WORKSPACE "portable\backend\mecdis-backend.exe"
          $dst2 = Join-Path $env:GITHUB_WORKSPACE "appimage\portable\backend\mecdis-backend.exe"

          New-Item -Force -ItemType Directory (Split-Path $dst)  | Out-Null
          New-Item -Force -ItemType Directory (Split-Path $dst2) | Out-Null

          Write-Host "Downloading backend: $url"
          Invoke-WebRequest -Uri $url -OutFile $dst

          Copy-Item -Force $dst $dst2

          $len = (Get-Item $dst).Length
          if ($len -lt 1000000) { throw "Backend demasiado chico ($len bytes). Descarga incompleta." }
          Write-Host "Backend OK, size: $len bytes"

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: false

      - name: Build Windows UI (Release)
        working-directory: flutter
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release -v

      - name: Prepare dist (UI + portable backend)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item -Recurse -Force "flutter\build\windows\x64\runner\Release\*" "dist\"
          Copy-Item -Recurse -Force "portable" "dist\portable"

          if (!(Test-Path "dist\portable\backend\mecdis-backend.exe")) {
            throw "No se empaquetó el backend en dist\portable\backend\mecdis-backend.exe"
          }

      - name: Create final ZIP
        shell: pwsh
        run: |
          $run = "${{ github.run_number }}"
          $zip = "Mec-Dis-Soporte-Remoto-main-$run.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\*" -DestinationPath $zip -Force
          Write-Host "ZIP listo: $zip"

      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Mec-Dis-Soporte-Remoto-main-${{ github.run_number }}
          path: Mec-Dis-Soporte-Remoto-main-${{ github.run_number }}.zip

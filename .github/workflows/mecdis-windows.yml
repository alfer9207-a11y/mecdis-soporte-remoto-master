name: Mec-Dis Soporte Remoto (Windows Portable)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    env:
      # Cache binario de vcpkg en GitHub Actions
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
      VCPKG_INSTALLATION_ROOT: C:\vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install vcpkg + opus (classic mode)
        shell: pwsh
        run: |
          if (-not (Test-Path $Env:VCPKG_INSTALLATION_ROOT)) {
            git clone https://github.com/microsoft/vcpkg $Env:VCPKG_INSTALLATION_ROOT
          }
          cd $Env:VCPKG_INSTALLATION_ROOT
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install opus --classic --x-install-root=C:\vcpkg\installed

      - name: Build Rust backend (service)
        shell: pwsh
        run: |
          cargo build --release --bin service

      - name: Build Flutter UI (Windows)
        shell: pwsh
        working-directory: flutter
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package portable zip
        shell: pwsh
        run: |
          $out = "portable_out"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item -Recurse -Force "flutter\build\windows\x64\runner\Release\*" $out

          New-Item -ItemType Directory -Force -Path "$out\backend" | Out-Null
          Copy-Item -Force "target\release\service.exe" "$out\backend\mecdis-backend.exe"

          Compress-Archive -Path "$out\*" -DestinationPath "MecDis_Soporte_Remoto_Portable.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MecDis_Soporte_Remoto_Portable
          path: MecDis_Soporte_Remoto_Portable.zip

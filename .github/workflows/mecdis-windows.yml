name: Mec-Dis Windows Build (Installer + Portable)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # Keep it stable: do NOT use manifest mode here
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Flutter (with cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter sanity (doctor + precache + pub get)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter --version
          flutter config --no-analytics --no-cli-animations
          for ($i=1; $i -le 3; $i++) {
            flutter precache --windows
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          flutter doctor -v
          Push-Location flutter
          flutter pub get
          Pop-Location

      - name: MSVC dev cmd (needed for vcpkg + native deps)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg (if missing)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat
          }
          & C:\vcpkg\vcpkg.exe version
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET"

      - name: Ensure Opus via vcpkg (classic mode ONLY) [STABLE]
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trip = $env:VCPKG_DEFAULT_TRIPLET
          if ([string]::IsNullOrWhiteSpace($trip)) { $trip = "x64-windows" }

          $hdr = "C:\vcpkg\installed\$trip\include\opus\opus.h"
          if (Test-Path $hdr) {
            Write-Host "OK: Found $hdr"
            exit 0
          }

          $log = Join-Path $env:RUNNER_TEMP "vcpkg-opus-classic.log"
          Write-Host "Installing ONLY opus via vcpkg classic mode -> triplet=$trip"
          & "C:\vcpkg\vcpkg.exe" install opus `
            "--classic" `
            "--x-install-root=C:\vcpkg\installed" `
            "--triplet" $trip `
            "--clean-after-build" 2>&1 | Tee-Object -FilePath $log

          if ($LASTEXITCODE -ne 0) {
            Write-Host "==== vcpkg-opus-classic.log (tail) ===="
            Get-Content $log -Tail 250
            throw "vcpkg opus (classic) install failed"
          }

          if (-not (Test-Path $hdr)) {
            Write-Host "==== vcpkg-opus-classic.log (tail) ===="
            Get-Content $log -Tail 250
            throw "Opus headers still missing after classic install"
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build portable packer (needed for installer exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -p rustdesk-portable-packer --release

      - name: Build Mec-Dis (Flutter) + create Installer EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python build.py --flutter --portable

      - name: Prepare Mec-Dis artifacts (Setup EXE + Portable ZIP)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1) Installer EXE produced by build.py (libs/portable/rustdesk-<ver>-install.exe)
          $installer = Get-ChildItem -Path "libs/portable" -Filter "rustdesk-*-install.exe" -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if ($null -eq $installer) {
            Write-Host "Installer not found under libs/portable."
            Get-ChildItem -Path "libs/portable" -File | Select-Object Name,Length,LastWriteTime
            throw "Installer EXE not generated"
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $setupOut = Join-Path "dist" "Mec-Dis-Soporte-Remoto-Setup.exe"
          Copy-Item $installer.FullName $setupOut -Force
          Write-Host "Setup EXE: $setupOut"

          # 2) Portable ZIP from Flutter Release folder
          $releaseDir = "flutter\build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            Write-Host "Release folder not found: $releaseDir"
            Get-ChildItem -Path "flutter\build\windows" -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object FullName | Out-String | Write-Host
            throw "Flutter Release output missing"
          }

          $portableZip = Join-Path "dist" "Mec-Dis-Soporte-Remoto-Portable.zip"
          if (Test-Path $portableZip) { Remove-Item $portableZip -Force }
          Compress-Archive -Path (Join-Path $releaseDir "*") -DestinationPath $portableZip
          Write-Host "Portable ZIP: $portableZip"

      - name: Upload Mec-Dis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mec-Dis-Windows
          path: dist/*

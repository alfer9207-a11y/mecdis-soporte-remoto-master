name: Mec-Dis Windows Build FINAL

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Build the Rust core (backend) and ship it as portable\backend\mecdis-backend.exe.
      # Without this, the downloaded artifact will contain only a placeholder file (few bytes)
      # and nothing will listen on the expected local port.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate CI vcpkg usage (BLINDADO)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Opciones comunes de vcpkg install que llevan valor (para no confundir valores con paquetes)
          $optsWithValue = @(
            '--triplet','--host-triplet',
            '--overlay-ports','--overlay-triplets',
            '--x-install-root','--x-packages-root','--x-buildtrees-root','--x-downloads-root',
            '--x-manifest-root','--vcpkg-root'
          )

          $badHits = @()

          Get-ChildItem -Path ".github/workflows" -Filter "*.yml" -File | ForEach-Object {
            $file = $_.FullName
            $lines = Get-Content $file

            foreach ($line in $lines) {
              # Detecta llamadas a vcpkg (vcpkg / vcpkg.exe / & "path\vcpkg.exe") con 'install'
              if ($line -match '^\s*(?:&\s*)?.*vcpkg(?:\.exe)?\s+install\s+') {
                $rest = ($line -replace '^\s*(?:&\s*)?.*vcpkg(?:\.exe)?\s+install\s+','').Trim()
                if ($rest.Length -eq 0) { continue }

                $tokens = $rest -split '\s+'
                $skipNext = $false
                $illegal = $null

                foreach ($t in $tokens) {
                  if ($skipNext) { $skipNext = $false; continue }

                  if ($t.StartsWith('-')) {
                    if ($optsWithValue -contains $t) { $skipNext = $true }
                    continue
                  }

                  # Token sin '-' que NO es valor esperado -> es muy probable que sea paquete (ilegal en manifest mode)
                  $illegal = $t
                  break
                }

                if ($illegal) {
                  $badHits += [pscustomobject]@{ File=$file; Line=$line.Trim() }
                }
              }
            }
          }

          if ($badHits.Count -gt 0) {
            Write-Error "Uso ilegal detectado: 'vcpkg install <paquete>' en manifest mode. Usa SOLO: vcpkg install (sin nombres de paquetes)."
            $badHits | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          } else {
            Write-Host "OK: No se detectó 'vcpkg install <paquete>' en workflows."
          }

      - name: Setup vcpkg (MANIFEST MODE - BLINDADO)
        shell: pwsh
        env:
          VCPKG_FEATURE_FLAGS: manifests
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = "${{ github.workspace }}"
          $manifest = Join-Path $repoRoot "vcpkg.json"
          if (!(Test-Path $manifest)) { throw "vcpkg.json NO existe en la raíz. Este build requiere manifest mode." }
          $vcpkg = Join-Path $repoRoot "vcpkg"
          if (!(Test-Path $vcpkg)) {
            git clone https://github.com/microsoft/vcpkg $vcpkg
          }
          & "$vcpkg\bootstrap-vcpkg.bat"
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          Push-Location $repoRoot
          & "$vcpkg\vcpkg.exe" install --triplet x64-windows --clean-after-build
          Pop-Location

      - name: Build backend (RustDesk core)
        shell: pwsh
        run: |
          # Build the main Rust binary. Some forks use the "flutter" feature; if your fork does not,
          # remove the --features flag.
          cargo build --release --features flutter

          $exe = "${{ github.workspace }}\\target\\release\\rustdesk.exe"
          if (!(Test-Path $exe)) { throw "Backend build did not produce rustdesk.exe at: $exe" }

          # Copy/rename to the expected locations
          New-Item -Force -ItemType Directory "portable\\backend" | Out-Null
          New-Item -Force -ItemType Directory "appimage\\portable\\backend" | Out-Null
          Copy-Item -Force $exe "portable\\backend\\mecdis-backend.exe"
          Copy-Item -Force $exe "appimage\\portable\\backend\\mecdis-backend.exe"

          # Safety check: ensure it is a real executable (not a tiny placeholder)
          $len = (Get-Item "portable\\backend\\mecdis-backend.exe").Length
          if ($len -lt 1000000) { throw "mecdis-backend.exe too small ($len bytes). Backend packaging is broken." }

      - name: Install Flutter (Dart >= 3.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: false

      - name: Verify Flutter/Dart versions
        shell: pwsh
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build Windows EXE (Release, verbose)
        working-directory: flutter
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: flutter build windows --release -v

      - name: Prepare portable
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force flutter\build\windows\x64\runner\Release\* dist\
          Copy-Item -Recurse -Force portable dist\portable

      - name: Zip portable
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath Mec-Dis-Soporte-Remoto.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mec-Dis-Soporte-Remoto
          path: Mec-Dis-Soporte-Remoto.zip
